<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RepoPilot Settings</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260708-nav6" />
  </head>
  <body>
    <main>
      <section class="toolbar">
        <div class="topline">
          <div>
            <h1 data-i18n="settings">Model Settings</h1>
            <p class="subtitle" data-i18n="tagline">Evidence-first issue triage for local repositories.</p>
          </div>
          <div class="nav-actions">
            <a class="nav-button nav-link" href="/" data-i18n="back">Back</a>
            <button class="nav-button" id="langToggle" type="button">中文</button>
          </div>
        </div>
        <label><span data-i18n="provider">Provider</span>
          <select id="provider">
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </label>
      </section>

      <section id="openaiPanel">
        <h2>OpenAI</h2>
        <label><span data-i18n="apiKey">API Key</span> <input id="openaiKey" type="password" data-i18n-placeholder="keepKey" placeholder="Leave blank to keep existing key" /></label>
        <label><span data-i18n="baseUrl">Base URL</span> <input id="openaiBaseUrl" placeholder="https://api.openai.com/v1" /></label>
        <label><span data-i18n="model">Model</span>
          <select id="openaiModel"></select>
        </label>
      </section>

      <section id="anthropicPanel">
        <h2>Anthropic</h2>
        <label><span data-i18n="apiKey">API Key</span> <input id="anthropicKey" type="password" data-i18n-placeholder="keepKey" placeholder="Leave blank to keep existing key" /></label>
        <label><span data-i18n="baseUrl">Base URL</span> <input id="anthropicBaseUrl" placeholder="https://api.anthropic.com/v1" /></label>
        <label><span data-i18n="model">Model</span>
          <select id="anthropicModel"></select>
        </label>
      </section>

      <section>
        <div class="actions">
          <button id="fetchModelsBtn" data-i18n="fetchModels">Fetch Models</button>
          <button id="saveBtn" data-i18n="save">Save</button>
        </div>
        <pre id="statusPanel" data-i18n="loading">Loading...</pre>
      </section>
    </main>
    <script src="/static/i18n.js?v=20260708-nav6"></script>
    <script src="/static/settings.js?v=20260708-nav6"></script>
  </body>
</html>
