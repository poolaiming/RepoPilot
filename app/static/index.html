<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RepoPilot</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/styles.css?v=20260719-chat6" />
  </head>
  <body class="app-body">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark">R</div>
          <div>
            <strong>RepoPilot</strong>
            <span data-i18n="chatAgent">工程对话 Agent</span>
          </div>
        </div>

        <button class="primary-button new-chat-button" id="newChatBtn" type="button" data-i18n-aria-label="newConversation" aria-label="新建对话">
          <span aria-hidden="true">＋</span>
          <span data-i18n="newConversation">新建对话</span>
        </button>

        <div class="sidebar-label" data-i18n="recentConversations">最近对话</div>
        <nav class="conversation-list" id="conversationList" aria-label="Conversations"></nav>

        <div class="sidebar-footer">
          <a class="sidebar-link settings-link" href="/settings" data-i18n-aria-label="settings" aria-label="模型设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z" />
              <path d="M19.4 15a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2-1.55-2-3.46-2.47 1a7.5 7.5 0 0 0-1.73-1L14.85 5h-4l-.35 2.99a7.5 7.5 0 0 0-1.73 1l-2.47-1-2 3.46L6.3 13a7.8 7.8 0 0 0-.1 1 7.8 7.8 0 0 0 .1 1l-2 1.55 2 3.46 2.47-1a7.5 7.5 0 0 0 1.73 1l.35 2.99h4l.35-2.99a7.5 7.5 0 0 0 1.73-1l2.47 1 2-3.46L19.4 15Z" />
            </svg>
            <span data-i18n="settings">模型设置</span>
          </a>
          <button class="sidebar-link" id="langToggle" type="button">中文</button>
        </div>
      </aside>

      <main class="chat-main">
        <header class="chat-header">
          <div>
            <span class="eyebrow" data-i18n="currentWorkspace">当前工作区</span>
            <h1 id="conversationTitle" data-i18n="welcomeTitle">开始一次工程对话</h1>
            <p id="repoLabel" data-i18n="welcomeSubtitle">选择本地仓库，让 Agent 带着上下文持续排查。</p>
          </div>
          <span class="status-pill"><span class="status-dot"></span><span data-i18n="memoryOn">记忆已开启</span></span>
        </header>

        <section class="setup-view" id="setupView">
          <div class="setup-card">
            <div class="setup-copy">
              <span class="eyebrow" data-i18n="workspaceSetup">工作区设置</span>
              <h2 data-i18n="connectRepository">连接一个本地仓库</h2>
              <p data-i18n="connectRepositoryHint">对话、代码证据和长期记忆都会按仓库隔离。</p>
            </div>
            <form id="workspaceForm" class="setup-form">
              <label>
                <span data-i18n="repoPath">本地仓库路径</span>
                <input id="repoPath" required placeholder="F:/work/project" autocomplete="off" />
              </label>
              <label>
                <span data-i18n="issueUrlOptional">GitHub Issue（可选）</span>
                <input id="issueUrl" type="url" placeholder="https://github.com/org/repo/issues/123" autocomplete="off" />
              </label>
              <button class="primary-button" id="createConversationBtn" type="submit" data-i18n="startConversation">开始对话</button>
              <p class="form-error" id="setupError" role="alert"></p>
            </form>
          </div>
        </section>

        <section class="chat-view" id="chatView" hidden>
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer" id="messageForm">
            <label class="sr-only" for="messageInput" data-i18n="message">消息</label>
            <textarea
              id="messageInput"
              rows="1"
              maxlength="8000"
              data-i18n-placeholder="messagePlaceholder"
              placeholder="描述问题，或输入“记住：这个项目使用 pytest”"
            ></textarea>
            <button class="send-button" id="sendBtn" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </form>
          <p class="composer-hint" data-i18n="composerHint">Enter 发送，Shift + Enter 换行；用“记住：...”保存仓库长期记忆。</p>
        </section>
      </main>

      <aside class="context-panel">
        <section class="context-section">
          <div class="context-heading">
            <div>
              <span class="eyebrow" data-i18n="longTerm">长期</span>
              <h2 data-i18n="engineeringMemory">工程记忆</h2>
            </div>
            <span class="count-badge" id="memoryCount">0</span>
          </div>
          <div class="context-list" id="memoryList">
            <p class="empty-copy" data-i18n="noMemory">还没有保存的记忆。</p>
          </div>
        </section>

        <section class="context-section">
          <div class="context-heading">
            <div>
              <span class="eyebrow" data-i18n="currentRound">本轮</span>
              <h2 data-i18n="codeEvidence">代码证据</h2>
            </div>
            <span class="count-badge" id="evidenceCount">0</span>
          </div>
          <div class="context-list evidence-list" id="evidenceList">
            <p class="empty-copy" data-i18n="noEvidence">发送问题后显示相关文件。</p>
          </div>
        </section>

        <section class="context-section test-section">
          <div class="context-heading">
            <div>
              <span class="eyebrow" data-i18n="verification">验证</span>
              <h2 data-i18n="testCommands">测试命令</h2>
            </div>
          </div>
          <div class="command-chips" id="commandChips"></div>
          <label class="command-input">
            <span class="sr-only" data-i18n="testCommand">测试命令</span>
            <input id="testCommand" data-i18n-placeholder="testCommandPlaceholder" placeholder="python -m pytest -q" />
          </label>
          <button class="secondary-button" id="runTestBtn" type="button" disabled data-i18n="runTest">运行测试</button>
          <p class="form-error" id="testError" role="alert"></p>
        </section>
      </aside>
    </div>

    <script src="/static/i18n.js?v=20260719-chat5"></script>
    <script src="/static/app.js?v=20260719-chat5"></script>
  </body>
</html>
